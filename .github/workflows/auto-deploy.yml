name: Auto Deploy to VM

on:
  repository_dispatch:
    types: [deploy-request]
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "${{ secrets.VM_HOST_KEY }}" >> ~/.ssh/known_hosts

      - name: Detect which project to deploy
        id: detect
        run: |
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            # Triggered by a specific project — deploy only that one
            PROJECT_NAME="${{ github.event.client_payload.project_name }}"
            echo "DEPLOY_MODE=single" >> $GITHUB_OUTPUT
            echo "PROJECT_NAME=$PROJECT_NAME" >> $GITHUB_OUTPUT
            echo "Deploying single project: $PROJECT_NAME"
          else
            # Push to this repo or manual trigger — deploy all active projects
            echo "DEPLOY_MODE=all" >> $GITHUB_OUTPUT
            echo "Deploying all active projects"
          fi

      - name: Deploy project(s)
        env:
          VM_USER: ${{ secrets.VM_USER }}
          VM_IP: ${{ secrets.VM_IP }}
        run: |
          DEPLOY_MODE="${{ steps.detect.outputs.DEPLOY_MODE }}"
          PROJECT_NAME="${{ steps.detect.outputs.PROJECT_NAME }}"

          # Parse deploy-config.json
          PROJECTS=$(node -e "
            const config = require('./deploy-config.json');
            let projects = config.projects.filter(p => p.active);
            if ('$DEPLOY_MODE' === 'single') {
              projects = projects.filter(p => p.name === '$PROJECT_NAME');
            }
            projects.forEach(p => {
              console.log([p.name, p.repository, p.port, p.dockerfile || 'Dockerfile'].join('|'));
            });
          ")

          if [ -z "$PROJECTS" ]; then
            echo "⚠️ No projects to deploy"
            exit 0
          fi

          echo "$PROJECTS" | while IFS='|' read -r NAME REPO PORT DOCKERFILE; do
            echo ""
            echo "========================================="
            echo "  Deploying: $NAME (port $PORT)"
            echo "========================================="
            echo ""

            ssh -o StrictHostKeyChecking=no "$VM_USER@$VM_IP" \
              "bash /opt/apps/deploy.sh '$NAME' '$REPO' '$PORT' '$DOCKERFILE'"

            echo "✅ $NAME deployed!"
          done

      - name: Reload Nginx
        env:
          VM_USER: ${{ secrets.VM_USER }}
          VM_IP: ${{ secrets.VM_IP }}
        run: |
          ssh -o StrictHostKeyChecking=no "$VM_USER@$VM_IP" "sudo nginx -t && sudo systemctl reload nginx"
          echo "✅ Nginx reloaded"

      - name: Deployment complete
        run: |
          echo "🎉 All projects deployed successfully!"
